<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browse Produce — ZedFarm Market</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <div class="brand-wrapper">
        <a class="brand" href="index.html">
          <span class="brand-icon" aria-hidden="true">🌾</span>
          <span><span data-i18n="site.title">ZedFarm Market</span></span>
          <span class="brand-badge">🇿🇲 Zambia</span>
        </a>
      </div>

      <div class="header-right">
        <div class="toolbar" role="group" aria-label="Audio and language tools">
          <button type="button" id="readPageBtn" class="read-page-btn" data-i18n="tts.readPage" aria-label="Read this page aloud">🔊 Listen</button>
          <label for="lang-select" class="sr-only" data-i18n="lang.label">Language</label>
          <select id="lang-select" aria-label="Select website language">
            <option value="en">🇿🇲 English</option>
            <option value="bem">🇿🇲 Chibemba</option>
            <option value="ny">🇿🇲 ChiNyanja</option>
          </select>
        </div>

        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

      <nav class="nav" id="main-nav" aria-label="Primary Navigation">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="browse.html" class="active" data-i18n="nav.browse">Browse</a>
        <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
        <a href="login.html" id="nav-login" data-i18n="nav.login">Log in</a>
        <a href="signup.html" id="nav-signup" class="btn-nav-primary" data-i18n="nav.signup">Sign up</a>
        <button type="button" id="nav-logout" data-i18n="nav.logout" style="display: none !important;" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="container">
      <div style="margin-bottom: 20px;">
        <h1 class="section-title" data-i18n="browse.title">Browse products</h1>
        <p style="margin:4px 0 0; color:var(--color-muted);">Search and filter fresh produce and livestock across Zambia</p>
      </div>

      <!-- FILTER CONTROLS CARD -->
      <div class="filter-card">
        <form id="search-form" class="search-bar" role="search" style="margin-bottom: 14px;">
          <input id="q" name="q" type="search" data-i18n-placeholder="browse.searchPlaceholder" placeholder="Search products by crop, keyword, or district..." />
          <button class="btn btn--primary" type="submit" data-i18n="browse.search">🔍 Search</button>
        </form>

        <div class="filters">
          <div>
            <label for="filter-category" class="sr-only">Category</label>
            <select id="filter-category" aria-label="Category">
              <option value="" data-i18n="browse.allCategories">All categories</option>
              <option value="maize">🌽 Maize</option>
              <option value="groundnuts">🥜 Groundnuts</option>
              <option value="cassava">🍠 Cassava</option>
              <option value="vegetables">🥬 Vegetables</option>
              <option value="livestock">🐐 Livestock</option>
              <option value="honey">🍯 Pure Honey</option>
              <option value="other">🌾 Other Crops</option>
            </select>
          </div>
          <div>
            <label for="filter-province" class="sr-only">Province</label>
            <select id="filter-province" aria-label="Province">
              <option value="" data-i18n="browse.allProvinces">All provinces</option>
              <option value="Central">Central Province</option>
              <option value="Copperbelt">Copperbelt Province</option>
              <option value="Eastern">Eastern Province</option>
              <option value="Luapula">Luapula Province</option>
              <option value="Lusaka">Lusaka Province</option>
              <option value="Muchinga">Muchinga Province</option>
              <option value="Northern">Northern Province</option>
              <option value="North-Western">North-Western Province</option>
              <option value="Southern">Southern Province</option>
              <option value="Western">Western Province</option>
            </select>
          </div>
          <div>
            <label for="filter-district" class="sr-only">District</label>
            <input id="filter-district" type="text" data-i18n-placeholder="browse.district" placeholder="District (e.g. Chongwe, Kitwe)" />
          </div>
          <div>
            <label for="filter-sort" class="sr-only">Sort by</label>
            <select id="filter-sort" aria-label="Sort">
              <option value="newest" data-i18n="browse.sortNewest">Newest first</option>
              <option value="price_asc" data-i18n="browse.sortPriceAsc">Price: low to high</option>
              <option value="price_desc" data-i18n="browse.sortPriceDesc">Price: high to low</option>
            </select>
          </div>
        </div>

        <div class="filters-secondary">
          <div style="display:flex; align-items:center; gap:8px;">
            <label for="filter-min" style="font-size:0.85rem; color:var(--color-muted); font-weight:600;">Min ZMW:</label>
            <input id="filter-min" type="number" style="width:110px;" placeholder="0" />
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <label for="filter-max" style="font-size:0.85rem; color:var(--color-muted); font-weight:600;">Max ZMW:</label>
            <input id="filter-max" type="number" style="width:110px;" placeholder="Any" />
          </div>
          <label style="display:inline-flex; align-items:center; gap:6px; cursor:pointer; margin-left:auto; font-size:0.92rem; font-weight:600;">
            <input type="checkbox" id="filter-sold" />
            <span data-i18n="browse.showSold">Show sold</span>
          </label>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <p id="results-count" aria-live="polite" style="margin:0; font-weight:600; color:var(--color-muted);"></p>
      </div>

      <div id="results" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <span aria-hidden="true">🌾</span>
        <span>ZedFarm Market</span>
      </div>
      <div>
        <p style="margin: 0;" data-i18n="footer.text">© ZedFarm Market — connecting Zambian farmers and buyers.</p>
      </div>
    </div>
  </footer>

  <div id="live-region" class="live-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Regular classic scripts: work with file:/// and http/https -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
