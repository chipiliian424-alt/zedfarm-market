<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — ZedFarm Market</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <div class="brand-wrapper">
        <a class="brand" href="index.html">
          <span class="brand-icon" aria-hidden="true">🌾</span>
          <span><span data-i18n="site.title">ZedFarm Market</span></span>
          <span class="brand-badge">🇿🇲 Zambia</span>
        </a>
      </div>

      <div class="header-right">
        <div class="toolbar" role="group" aria-label="Audio and language tools">
          <button type="button" id="readPageBtn" class="read-page-btn" data-i18n="tts.readPage" aria-label="Read this page aloud">🔊 Listen</button>
          <label for="lang-select" class="sr-only" data-i18n="lang.label">Language</label>
          <select id="lang-select" aria-label="Select website language">
            <option value="en">🇿🇲 English</option>
            <option value="bem">🇿🇲 Chibemba</option>
            <option value="ny">🇿🇲 ChiNyanja</option>
          </select>
        </div>

        <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
      </div>

      <nav class="nav" id="main-nav" aria-label="Primary Navigation">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="browse.html" data-i18n="nav.browse">Browse</a>
        <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
        <a href="login.html" class="active" id="nav-login" data-i18n="nav.login">Log in</a>
        <a href="signup.html" id="nav-signup" class="btn-nav-primary" data-i18n="nav.signup">Sign up</a>
        <button type="button" id="nav-logout" data-i18n="nav.logout" style="display: none !important;" hidden>Log out</button>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="container" style="max-width:480px; padding-top:20px;">
      <div class="card" style="padding:32px 28px; box-shadow:var(--shadow-md); border-radius:var(--radius-lg);">
        <div style="text-align:center; margin-bottom:24px;">
          <div style="font-size:2.4rem; line-height:1; margin-bottom:8px;" aria-hidden="true">👨‍🌾</div>
          <h1 style="font-size:1.8rem; margin:0 0 6px; color:var(--color-primary);" data-i18n="auth.loginTitle">Log in</h1>
          <p style="margin:0; color:var(--color-muted); font-size:0.95rem;">Access your ZedFarm account to post &amp; manage produce</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" data-i18n="auth.email">Email</label>
            <input id="email" type="email" placeholder="e.g. farmer@example.com" required autocomplete="email" />
            <div class="error" role="alert"></div>
          </div>

          <div class="form-group">
            <label for="password" data-i18n="auth.password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
            <div class="error" role="alert"></div>
          </div>

          <div id="form-error" class="error" role="alert" style="display:none; margin-bottom:14px; padding:10px 14px; background:var(--color-error-bg); border-radius:var(--radius-sm); border:1px solid #fca5a5;"></div>

          <button class="btn btn--primary" type="submit" style="width:100%; font-size:1.05rem;" data-i18n="auth.loginBtn">Log in</button>

          <p style="text-align:center; margin-top:20px; font-size:0.95rem;">
            <span data-i18n="auth.noAccount">No account?</span>
            <a href="signup.html" style="font-weight:700;" data-i18n="nav.signup">Create farmer account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <span aria-hidden="true">🌾</span>
        <span>ZedFarm Market</span>
      </div>
      <div>
        <p style="margin: 0;" data-i18n="footer.text">© ZedFarm Market — connecting Zambian farmers and buyers.</p>
      </div>
    </div>
  </footer>

  <div id="live-region" class="live-region" aria-live="polite" aria-atomic="true"></div>

  <!-- Regular classic scripts: work with file:/// and http/https -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
